name: Enriquecer imagens via Wikidata/Commons

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Escopo do enriquecimento"
        required: true
        default: "tudo"
        type: choice
        options:
          - tudo
          - apenas-marcas
          - apenas-veiculos
          - dry-run

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Executar enriquecimento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.modo == 'dry-run' && '1' || '' }}
          APENAS_MARCAS: ${{ inputs.modo == 'apenas-marcas' && '1' || '' }}
          APENAS_VEICULOS: ${{ inputs.modo == 'apenas-veiculos' && '1' || '' }}
        run: node scripts/enriquecer-imagens.mjs
